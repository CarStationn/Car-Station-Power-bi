# ============================================================
# Nginx do container "web".
#
# Sem TLS de propósito: quem termina HTTPS é a Cloudflare, e o
# cloudflared entrega aqui em HTTP dentro da rede do Docker.
# ============================================================

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- API ----------
    # "api" é o nome do serviço no docker-compose; o Docker resolve.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;

        # Sem estes cabeçalhos a aplicação não descobre o IP real de
        # quem chamou, e o limite de tentativas de login passa a contar
        # todos os usuários num balde só.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- Arquivos estáticos ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # O endereço da API vive aqui: nunca deve ficar em cache.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # ---------- Segurança ----------
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Não anunciar a versão do Nginx
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
