# ============================================================
# Portal Car Station Indicadores — PRODUÇÃO na VPS da empresa.
#
# Segue o padrão da casa: imagens prontas no GHCR (publicadas pelo
# GitHub Actions a cada push no main), nada é compilado na VPS.
# Na VPS ficam só este arquivo e o .env, em:
#
#   /opt/carstation/indicadores/
#
# Atualizar para a versão mais nova do main:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Voltar para uma versão anterior: TAG=<sha do commit> no .env e
# repetir os dois comandos acima.
# ============================================================

name: indicadores

services:

  db:
    image: postgres:17-alpine
    container_name: indicadores-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - indicadores-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - indicadores

  api:
    image: ghcr.io/carstationn/indicadores-api:${TAG:-latest}
    container_name: indicadores-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - indicadores

  web:
    image: ghcr.io/carstationn/indicadores-web:${TAG:-latest}
    container_name: indicadores-web
    restart: unless-stopped
    ports:
      # Só no localhost: o cloudflared (rede do host) chega aqui e
      # publica em https://indicadores.carstation.com.br
      - "127.0.0.1:8095:80"
    depends_on:
      - api
    networks:
      - indicadores

volumes:
  indicadores-db:
    name: indicadores-db

networks:
  indicadores:
    name: indicadores
